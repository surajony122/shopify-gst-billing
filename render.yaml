services:
  - type: web
    name: wom-gst-invoice
    runtime: node
    plan: starter
    region: singapore # Closest to India for lowest latency
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shopify-gst-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,read_orders
      - key: APP_URL
        sync: false
      - key: GST_PORTAL_API_KEY
        sync: false

databases:
  - name: shopify-gst-db
    plan: basic-256mb
    region: singapore
    databaseName: gst_billing
    user: gst_admin
